<div>
  <app-banner
    headline="Contact Us"
    subline="Driving Digital Growth Through Smart IT Solutions"
    image="https://darchtech.com/assets/images/banner/bnr-6.jpg"
    inputPosition="center"
  ></app-banner>
  <div class="container">
    <div class="row">
      <div class="col-8"></div>
      <div class="col-4">
        <form [formGroup]="contactForm" (ngSubmit)="submitHandler()" class="card border-0 p-4 rounded-0 p-3 my-4 bg-danger-subtle gap-3">
          <h4 class="text-danger p-3 pt-4">Get In Touch</h4>
          <input
          formControlName="name"
          type="text"
          class="form-control bg-transparent border-0 border-bottom border-danger pb-2 rounded-0"
            placeholder="Your Name"
          />
          <input
          formControlName="email"
          type="text"
          class="form-control bg-transparent border-0 border-bottom border-danger pb-2 rounded-0"
          placeholder="Your Email"
          />
          <input
          formControlName="phone"
          type="text"
          class="form-control bg-transparent border-0 border-bottom border-danger pb-2 rounded-0"
          placeholder="Your Phone Number"
          />
          <textarea
          rows="5"
          formControlName="message"
          class="form-control bg-transparent border-0 border-bottom border-danger pb-2 rounded-0"
          placeholder="Tell us about your project"
          ></textarea>
          <button type="submit" class="btn btn-danger p-3 mt-5 rounded-5 w-50 mx-auto">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</div>
